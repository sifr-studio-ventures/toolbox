name: Assemble routes
on:
  push:
    branches: [cursor/open-toolbox-brand-8936]
    paths:
      - "_agent/routes-head.ts"
      - "_agent/routes-tail.ts"
      - ".github/workflows/assemble-routes.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate routes
        run: |
          cat _agent/routes-head.ts _agent/routes-tail.ts > src/factory/routes.ts
          wc -c src/factory/routes.ts
          test -s src/factory/routes.ts
          grep -q "Open Toolbox" src/factory/routes.ts
          grep -q "function missing" src/factory/routes.ts
      - name: Commit assembled routes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/factory/routes.ts
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Brand app copy as Open Toolbox"
          git push
