name: Assemble brand assets
on:
  push:
    branches: [cursor/logo-favicon-spacing-c7fb]
    paths: [_agent/ap.**, _agent/m1.**, _agent/m2.**, .github/workflows/assemble-brand-assets.yml]
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and publish brand-png assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request, urllib.error, re
          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          branch = "cursor/logo-favicon-spacing-c7fb"

          def get_meta(path):
              api = f"https://api.github.com/repos/{repo}/contents/{path}?ref={branch}"
              req = urllib.request.Request(api, headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "User-Agent": "assemble"})
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return None
                  raise

          def put(path, data, message):
              meta = get_meta(path)
              body = {"message": message, "content": base64.b64encode(data).decode(), "branch": branch}
              if meta:
                  body["sha"] = meta["sha"]
              api = f"https://api.github.com/repos/{repo}/contents/{path}"
              req = urllib.request.Request(api, data=json.dumps(body).encode(), method="PUT", headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "User-Agent": "assemble", "Content-Type": "application/json"})
              with urllib.request.urlopen(req) as r:
                  out = json.load(r)
              print(path, out["commit"]["sha"], len(data), hashlib.sha1(data).hexdigest())

          def clean(text):
              return re.sub(r"\s+", "", text)

          root = pathlib.Path("_agent")
          apple_parts = sorted([p for p in root.glob("ap.*") if p.name.split(".")[1].isdigit()], key=lambda p: int(p.name.split(".")[1]))
          if len(apple_parts) >= 18:
              apple = "".join(clean(p.read_text()) for p in apple_parts)
              put("brand-png/apple-touch-icon.png.b64", apple.encode(), "Add apple-touch icon b64")
          m1_parts = sorted([p for p in root.glob("m1.*") if p.name.split(".")[1].isdigit()], key=lambda p: int(p.name.split(".")[1]))
          if len(m1_parts) >= 23:
              m1 = "".join(clean(p.read_text()) for p in m1_parts)
              put("brand-png/open-toolbox-mark.png.b64.part1", m1.encode(), "Add logo mark b64 part1")
          m2_parts = sorted([p for p in root.glob("m2.*") if p.name.split(".")[1].isdigit()], key=lambda p: int(p.name.split(".")[1]))
          if len(m2_parts) >= 23:
              m2 = "".join(clean(p.read_text()) for p in m2_parts)
              put("brand-png/open-toolbox-mark.png.b64.part2", m2.encode(), "Add logo mark b64 part2")
          print("apple_parts", len(apple_parts), "m1", len(m1_parts), "m2", len(m2_parts))
          PY
