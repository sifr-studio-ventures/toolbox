name: Assemble design-system
on:
  push:
    branches: [cursor/logo-favicon-spacing-c7fb]
    paths: [_agent/ds.h1.gz.b64, _agent/ds.h2.gz.b64, .github/workflows/assemble-design-system.yml]
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write src/design-system.ts from staged gzip halves
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          h1 = pathlib.Path("_agent/ds.h1.gz.b64").read_text().strip()
          h2 = pathlib.Path("_agent/ds.h2.gz.b64").read_text().strip()
          data = gzip.decompress(base64.b64decode(h1 + h2))
          pathlib.Path("src/design-system.ts").write_bytes(data)
          print(len(data), hashlib.sha1(data).hexdigest())
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/design-system.ts
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Update design-system page"
            git push
          fi
